# Версия конфига для первичной выдачи Let's Encrypt сертификата.
# Используется когда сертификата ещё нет: HTTP-only, без редиректа на HTTPS.
# После получения серта — переименовать `app.conf.disabled` → `app.conf` и убрать этот.
server {
    listen 80;
    listen [::]:80;
    server_name b2b-ws-trends.ru www.b2b-ws-trends.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
