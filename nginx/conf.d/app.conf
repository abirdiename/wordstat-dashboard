# --- HTTP: ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name b2b-ws-trends.ru www.b2b-ws-trends.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: основной сайт ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b2b-ws-trends.ru www.b2b-ws-trends.ru;

    ssl_certificate     /etc/letsencrypt/live/b2b-ws-trends.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b2b-ws-trends.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Размер тела запроса (большие списки запросов)
    client_max_body_size 2m;

    # Таймауты: Wordstat может отвечать долго при больших пачках
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;

    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
